# Example Hookline configuration.
#
# Copy this file to hookline.toml in your working directory, or pass it with
# --config. Environment variables (HOOKLINE_*) override anything set here.
# API keys are never read from this file: set them in the environment or .env.

log_level = "WARNING"        # DEBUG, INFO, WARNING or ERROR
log_format = "text"          # "text" or "json"
ai_enabled = true
max_email_bytes = 26214400   # 25 MiB

[llm]
provider = "ollama"          # "ollama" (local) or "anthropic" (needs ANTHROPIC_API_KEY)
ollama_url = "http://localhost:11434"
ollama_model = "llama3.1:8b"
anthropic_model = "claude-opus-5-5"
anthropic_effort = "medium"  # "low", "medium" or "high": how much the model reasons
timeout_seconds = 60
max_retries = 2
max_email_chars = 12000      # email text sent to the model is cut to this length
max_output_tokens = 16000    # upper bound on the answer, including reasoning
ollama_num_ctx = 8192        # context window requested from Ollama
redaction = "auto"           # "auto" (cloud providers only), "always" or "never"

[checks]
# Your organisation's domains, plus partners and brands worth protecting.
# Lookalikes of these are flagged.
protected_domains = ["larkspur.test", "fernhill-bank.test", "quillon-payroll.test"]
suspicious_tlds = ["zip", "mov", "top", "xyz", "click", "link", "country", "gq", "tk"]
url_shorteners = ["bit.ly", "tinyurl.com", "t.co", "is.gd", "ow.ly", "rb.gy"]
# Free webmail providers; replies routed to these from a business sender are flagged.
freemail_domains = ["gmail.com", "outlook.com", "hotmail.com", "yahoo.com", "proton.me", "inboxmail.test"]
# Your own mail servers, as named in their Authentication-Results headers. Set
# this so a forged header added by the sender further down is never trusted.
trusted_authserv_ids = ["mx1.larkspur.test"]

[threat_intel]
# Lookups only run for providers whose key is set in the environment
# (URLHAUS_AUTH_KEY, ABUSEIPDB_API_KEY, VIRUSTOTAL_API_KEY). Without keys,
# Hookline makes no network requests. Values are only looked up, never
# submitted, and private IPs, internal or reserved names and the protected
# domains are never sent.
enabled = true
timeout_seconds = 10
cache_dir = ".hookline-cache"
cache_ttl_hours = 24           # 0 turns the cache off
max_lookups_per_provider = 10  # per message
max_wait_seconds = 15          # longest wait for a rate-limit slot
lookup_urls = true             # URLs can carry tokens; turn off if that worries you
lookup_domains = true
lookup_ips = true
lookup_hashes = true

[threat_intel.virustotal]
requests_per_minute = 4        # public API limits; raise for a paid plan
requests_per_day = 500

[threat_intel.abuseipdb]
requests_per_minute = 60
requests_per_day = 1000

[threat_intel.urlhaus]
requests_per_minute = 60

[scoring]
suspicious_threshold = 35
malicious_threshold = 70
ai_max_points = 40           # most the AI can add; it never subtracts

[scoring.severity_points]
info = 0
low = 5
medium = 15
high = 30
critical = 50
