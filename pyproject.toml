[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hookline"
version = "0.1.0"
description = "Phishing email analyzer that pairs deterministic security checks with language model explanations."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["phishing", "email", "security", "soc", "threat-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "rich>=13.7",
    "tldextract>=5.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
hookline = "hookline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hookline"]

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # shadowed builtins
    "ARG",  # unused arguments
    "B",    # bugbear
    "BLE",  # blind except
    "C4",   # comprehensions
    "D",    # docstrings
    "DTZ",  # naive datetimes
    "E",    # pycodestyle errors
    "ERA",  # commented-out code
    "F",    # pyflakes
    "G",    # logging format strings
    "I",    # import order
    "LOG",  # logging misuse
    "N",    # naming
    "PT",   # pytest style
    "PTH",  # prefer pathlib
    "RET",  # return statements
    "RUF",  # ruff-specific
    "S",    # bandit security rules
    "SIM",  # simplifications
    "T20",  # print statements
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D105",  # magic methods are self-explanatory
    "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test doubles implement interfaces, so unused arguments are expected.
"tests/**" = ["ARG", "D", "S101", "S105", "S106"]

# --- Mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- Pytest and coverage ----------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=hookline",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["hookline"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
